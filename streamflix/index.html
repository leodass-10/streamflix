<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix — Live Sports Streaming</title>
    <meta name="description" content="Watch live sports for free. Football, basketball, tennis, MMA and more. Netflix-style streaming experience.">
    <meta name="theme-color" content="#141414">
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://streamed.pk">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400..700&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>
    <!-- Preloader -->
    <div class="preloader" id="preloader" style="position:fixed; inset:0; background:var(--black); z-index:9999; display:flex; align-items:center; justify-content:center;">
        <div class="t-display-lg" style="animation: preloader-pulse 1.5s infinite;">STREAMFLIX</div>
    </div>
    
    <!-- App Shell -->
    <div id="app"></div>
    
    <!-- Scripts (order matters) -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/state.js"></script>
    <script src="js/router.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
